name = "n-chen-rs"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "6087736750ab274809ddad92ed5e3ac6"
workers_dev = false

[[kv_namespaces]]
binding = "NOTES"
id = "5abeab410f7841eeb5b06942a3cfa42b"

# Workers AI binding for content moderation (phishing / malware / spam classification).
# Uses the free tier's Llama 3.1 8B instruct model for zero-cost classification.
[ai]
binding = "AI"

# Static assets (llms.txt, llms-full.txt, robots.txt, favicon.svg).
# Served directly from CF's edge (with ETag) before the Worker runs.
[assets]
directory = "./public"
binding = "ASSETS"

[[routes]]
pattern = "0g.hk"
zone_name = "0g.hk"
custom_domain = true

[[routes]]
pattern = "*.0g.hk/*"
zone_name = "0g.hk"

# Staging environment: deploy with `wrangler deploy --env staging`.
# Publishes to n-chen-rs-staging.<account>.workers.dev (no custom domain).
# Uses a dedicated KV namespace (NOTES_STAGING) so prod data is isolated.
[env.staging]
name = "n-chen-rs-staging"
workers_dev = true
# Override the top-level [[routes]] so staging does NOT try to bind 0g.hk.
# Without this, wrangler inherits the prod routes and conflicts on deploy.
routes = []

[[env.staging.kv_namespaces]]
binding = "NOTES"
id = "c317652a97c542e9b85ed03bfa24a96f"

[env.staging.ai]
binding = "AI"

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
